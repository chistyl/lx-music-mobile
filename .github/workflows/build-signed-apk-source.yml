name: Build Signed Android APK and Source ZIP

on:
  push:
    branches:
      - feature/disable-auto-update
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signed-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build JS bundle test
        run: npm run build-test

      - name: Check release signing secrets
        env:
          KEYSTORE_STORE_FILE: ${{ secrets.KEYSTORE_STORE_FILE }}
          KEYSTORE_STORE_FILE_BASE64: ${{ secrets.KEYSTORE_STORE_FILE_BASE64 }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_STORE_FILE KEYSTORE_STORE_FILE_BASE64 KEYSTORE_KEY_ALIAS KEYSTORE_PASSWORD KEYSTORE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Cannot sign an update APK without the same release keystore used by the installed app."
            exit 1
          fi

      - name: Build signed Android release APK
        env:
          KEYSTORE_STORE_FILE: ${{ secrets.KEYSTORE_STORE_FILE }}
          KEYSTORE_STORE_FILE_BASE64: ${{ secrets.KEYSTORE_STORE_FILE_BASE64 }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_STORE_FILE_BASE64" | base64 --decode > "android/app/$KEYSTORE_STORE_FILE"
          cd android
          ./gradlew assembleRelease \
            -PMYAPP_UPLOAD_STORE_FILE="$KEYSTORE_STORE_FILE" \
            -PMYAPP_UPLOAD_KEY_ALIAS="$KEYSTORE_KEY_ALIAS" \
            -PMYAPP_UPLOAD_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PMYAPP_UPLOAD_KEY_PASSWORD="$KEYSTORE_KEY_PASSWORD" \
            --no-daemon
          rm -f "app/$KEYSTORE_STORE_FILE"

      - name: Package source ZIP
        run: git archive --format=zip --output=lx-music-mobile-source.zip HEAD

      - name: Upload signed APK and source
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-mobile-signed-no-auto-update
          path: |
            android/app/build/outputs/apk/release/*.apk
            lx-music-mobile-source.zip
          if-no-files-found: error
          retention-days: 14
